name: Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with pylint
        run: |
          pylint shared/etrm_events producer/app spark/jobs reconcile || true

      - name: Format check with black
        run: |
          black --check shared/ producer/ spark/ reconcile/ tests/ || true

      - name: Type check with mypy
        run: |
          mypy shared/ producer/ || true

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=shared --cov=producer --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [producer, spark, reconcile, dashboard]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.service }}
          push: false
          tags: realtime-streaming-pipeline:${{ matrix.service }}-latest
